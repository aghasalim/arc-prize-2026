name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy pytest
      - run: python -m pytest tests/ -q
      # Guards the headline number: if the solver silently regresses, the
      # README's 39 stops being true and CI should say so.
      - name: solver still solves 39 training tasks
        run: |
          python - <<'PY'
          from arc.evaluate import run
          r = run("training")
          print(f"solved {r['solved']}/{r['n_tasks']}")
          assert r["solved"] >= 39, f"regression: {r['solved']} < 39"
          PY
